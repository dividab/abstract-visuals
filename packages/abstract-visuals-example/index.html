<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Abstract visuals</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.3/css/font-awesome.min.css">
    <style>
      /* The theme, set by the Theme select as data-theme on this element; color-scheme makes native controls follow it */
      :root {
        color-scheme: light;
        --background: #ffffff;
        --surface: rgb(230, 230, 230);
        --toolbar: rgb(251, 251, 251);
        --viewer: #cccccc;
        --text: #1a1a1a;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --background: #14161a;
        --surface: #1b1e23;
        --toolbar: #23272e;
        --viewer: #14161a;
        --text: #e4e6ea;
      }
      body {
        background: var(--background);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <script src="/text-encoder-polyfill.js" defer></script>
  </body>
</html>
