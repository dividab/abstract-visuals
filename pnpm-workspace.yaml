  "vite-plugin-node-polyfills": "^0.28.0"
  "@types/react": "^19.2.18"
  "@types/react-dom": "^19.2.7"
  "react": "^19.2.8"
  "react-dom": "^19.2.8"
  "vitest": "5.0.0"

overrides:
