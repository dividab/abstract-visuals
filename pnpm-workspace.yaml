packages:
  - "packages/*"

allowBuilds:
  esbuild: false
  husky: false
  nx: false

trustLockfile: true

minimumReleaseAgeExclude:
  - abstract-sheet
  - jsxpression
  - abstract-3d
  - abstract-chart
  - abstract-
  - abstract-image
  - handlebars-xml
  - abstract-document
  - oxlint-config-divid@1.0.0 || 1.0.1 || 1.0.2

overrides:
  three-stdlib: "^2.36.0"

packageExtensions:
  tunnel-rat@*:
    peerDependencies:
      react: "^19.0.0"
